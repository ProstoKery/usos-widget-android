name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]   # creating a release on GitHub attaches the freshly built APK to it
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UsosWidget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UsosWidget-apk
          path: UsosWidget.apk

      # The public download link: attach the APK when a release / version tag like v1.0.0 is created.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: USOS Widget ${{ github.ref_name }}
          body: |
            Download **UsosWidget.apk** below on your Android phone and open it.
            Step-by-step guide: https://github.com/${{ github.repository }}#readme
          files: UsosWidget.apk
          overwrite_files: true
          make_latest: true
